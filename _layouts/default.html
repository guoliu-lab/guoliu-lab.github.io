<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/images/logo.png' | relative_url }}">
</head>
<body>

  {% include nav.html %}

  {{ content }}

  <footer>
    <p>© {{ 'now' | date: "%Y" }} {{ site.title }} · Last updated {{ site.time | date: "%B %Y" }}</p>
  </footer>

</body>
</html>

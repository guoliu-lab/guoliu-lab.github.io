<nav class="navbar">
  <div class="nav-inner">
    <a class="nav-name" href="{{ '/' | relative_url }}"><img class="nav-logo" src="{{ '/images/logo.png' | relative_url }}" alt="{{ site.title }} logo">{{ site.title }}</a>
    <div class="nav-links">
      {%- for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </div>
  </div>
</nav>
